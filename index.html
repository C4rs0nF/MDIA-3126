<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link
            rel="stylesheet"
            href="styles.css" />
        <script
            src="scripts.js"
            defer></script>
    </head>
    <body>
        <div>
            <h2>lavender color button</h2>
            <button
                id="firstButton"
                style="
                    border: 3px solid rgb(36, 11, 86);
                    border-radius: 10px;
                    background-color: rgb(94, 97, 151);
                    color: rgb(240, 250, 255);
                    padding: 10px 15px;
                ">
                click me
            </button>
        </div>
        <div>
            <h2>big purple button</h2>
            <button
                id="secondButton"
                style="
                    font-family:
                        Impact, Haettenschweiler,
                        &quot;Arial Narrow Bold&quot;,
                        sans-serif;
                    font-size: 15px;
                    letter-spacing: 10px;
                    border: 3px solid rgb(67, 10, 39);
                    border-radius: 20px;
                    background-color: rgb(94, 40, 104);
                    color: rgb(240, 250, 255);
                    padding: 10px 20px;
                ">
                click me
            </button>
        </div>
        <div>
            <h2>glowing button</h2>
            <button
                id="thirdButton"
                style="
                    font-family:
                        Georgia,
                        &quot;Times New Roman&quot;, Times,
                        serif;
                    border: 2px solid rgb(72, 144, 185);
                    border-radius: 4px;
                    background-color: rgb(15, 19, 91);
                    color: rgb(240, 250, 255);
                    padding: 10px 15px;
                    filter: drop-shadow(
                        0px 0px 7px #0b42b0
                    );
                ">
                click me
            </button>
        </div>
        <div>
            <h2>shadow button</h2>
            <button
                id="fourthButton"
                style="
                    border:
                        3px,
                        solid rgb(2, 29, 2);
                    padding: 10px, 15px;
                    background-color: rgb(101, 177, 101);
                    color: rgb(2, 29, 2);
                    font-family:
                        &quot;Franklin Gothic Medium&quot;,
                        &quot;Arial Narrow&quot;, Arial,
                        sans-serif;
                    filter: drop-shadow(
                        5px 7px 4px #0909529e
                    );
                ">
                click me
            </button>
        </div>
    </body>
</html>
